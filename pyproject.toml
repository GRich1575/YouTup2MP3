[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-audio-downloader"
dynamic = ["version"]
description = "CLI tool for extracting authorized YouTube audio to MP3."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "G.Rich"}]
requires-python = ">=3.10"
keywords = ["youtube", "audio", "mp3", "yt-dlp", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
    "yt-dlp[default]>=2026.10.21",
    "static-ffmpeg>=2.7",
]

[project.urls]
Repository = "https://github.com/GRich1575/YouTup2MP3"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytaudio = "ytaudio_downloader.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "ytaudio_downloader.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: real YouTube download tests (run with: pytest -m network)",
]
