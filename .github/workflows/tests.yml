name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: pick up the newest yt-dlp even when nothing changed here.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Offline tests (network tests are deselected by default)
        run: python -m pytest -q

  network:
    # Real download against the latest yt-dlp. Runs only when the repo secret
    # YTAUDIO_TEST_URL (an authorized, non-live video) is set, so no URL lives
    # in the repository. Informational: YouTube may block CI IP ranges.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      YTAUDIO_TEST_URL: ${{ secrets.YTAUDIO_TEST_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install (latest yt-dlp)
        run: python -m pip install -U -e ".[dev]"
      - name: Network tests (skipped when secret is unset)
        run: python -m pytest -m network -q
